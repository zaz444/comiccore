<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="theme.css">
    <script src="theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComicCore - My Favorites</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@3.3.1/css/regular/straight.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

        :root {
            --accent: #ff7a00;
            --accent-rgb: 255,122,0;
            --bg: #0f0f11;
            --bg2: #18181b;
            --card: #1e1e22;
            --card2: #26262c;
            --border: rgba(255,255,255,0.08);
            --text: #f4f4f6;
            --text-muted: #888896;
            --text-dim: #55555f;
            --teal: #00c9b1;
            --teal-glow: rgba(0,201,177,0.18);
            --gold: #ffd700;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100dvh; padding-bottom: 24px;
            overflow-x: hidden; position: relative;
        }
        /* Ambient glows */
        body::before {
            content: ''; position: fixed; top: -100px; left: -80px;
            width: 480px; height: 480px;
            background: radial-gradient(circle, rgba(var(--accent-rgb),0.09) 0%, transparent 70%);
            pointer-events: none; z-index: 0;
        }
        body::after {
            content: ''; position: fixed; bottom: -80px; right: -60px;
            width: 380px; height: 380px;
            background: radial-gradient(circle, rgba(0,201,177,0.06) 0%, transparent 70%);
            pointer-events: none; z-index: 0;
        }

        /* ── Header ── */
        .header {
            position: sticky; top: 0; z-index: 100;
            height: 54px;
            background: rgba(15,15,17,0.88);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center;
            padding: 0 16px; gap: 10px;
            backdrop-filter: blur(20px);
        }
        .icon-btn {
            width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
            background: var(--card2); border: 1px solid var(--border); color: var(--text-muted);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 15px; transition: all 0.18s; text-decoration: none;
        }
        .icon-btn:hover { background: #303038; color: var(--text); transform: translateY(-1px); }
        .title {
            font-size: 15px; font-weight: 900;
            letter-spacing: .5px; color: var(--text);
            flex: 1;
        }
        .title span { color: var(--gold); margin-right: 6px; }

        /* ── Grid ── */
        .comics-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 16px;
            max-width: 680px;
            margin: 0 auto;
            position: relative; z-index: 1;
        }
        @media (min-width: 640px) {
            .comics-list { grid-template-columns: repeat(3, 1fr); max-width: 900px; }
        }

        /* ── Comic card (matches my-comics.html's .comic-card exactly) ── */
        .comic-card {
            cursor: pointer; position: relative;
            background: var(--card); border: 1.5px solid var(--border); border-radius: 16px;
            overflow: hidden; display: flex; flex-direction: column;
            transition: border-color .12s;
        }
        .comic-card:active { border-color: var(--accent); }

        /* Cover image area — square 1:1, matches my-comics' card size */
        .comic-card-cover { width: 100%; aspect-ratio: 1/1; overflow: hidden; background: #111; position: relative; }
        .comic-card-cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity .3s; }
        .comic-card-cover img.cover-loading { opacity: 0; }
        .comic-card-cover .no-cover {
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
            font-size: 32px; background: linear-gradient(135deg,#0f0f11,#1a1a2e);
        }
        /* Fav badge on cover */
        .comic-card-cover .fav-badge {
            position: absolute; top: 6px; right: 6px;
            background: rgba(255,215,0,0.15); color: var(--gold); border: 1px solid rgba(255,215,0,0.3);
            font-size: 8px; font-weight: 900; padding: 2px 7px; border-radius: 6px;
            letter-spacing: .5px; text-transform: uppercase; backdrop-filter: blur(4px);
        }

        /* Card info footer */
        .comic-card-info { padding: 8px 10px 10px; flex: 1; display: flex; flex-direction: column; gap: 2px; }
        .comic-card-title {
            font-size: 12px; font-weight: 800; color: var(--text);
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden; text-overflow: ellipsis; line-height: 1.28; min-height: 2.56em;
        }
        .comic-card-sub {
            font-size: 10px; color: var(--text-dim); font-weight: 700;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* ── Empty / error states (matches my-comics.html's .empty exactly) ── */
        .empty {
            text-align: center; padding: 64px 24px;
            display: flex; flex-direction: column; align-items: center; gap: 14px;
            grid-column: 1 / -1;
        }
        .empty-icon { font-size: 56px; opacity: .25; }
        .empty-title { font-size: 16px; font-weight: 900; color: var(--text-muted); }
        .empty-sub { font-size: 13px; color: var(--text-dim); line-height: 1.6; max-width: 260px; }
        .empty-cta {
            margin-top: 4px; padding: 13px 28px; background: var(--accent); color: #000;
            border: none; border-radius: 14px; font-size: 14px; font-weight: 900;
            cursor: pointer; font-family: 'Inter', sans-serif; letter-spacing: .3px;
        }

        /* ── Skeleton loading ── */
        .fav-skel { background: var(--card); border-radius: 16px; overflow: hidden; border: 1.5px solid var(--border); }
        .fav-skel .skel-cover { width: 100%; aspect-ratio: 1/1; background: linear-gradient(90deg,#1a1a1a 25%,#2c2c2c 50%,#1a1a1a 75%); background-size: 200%; animation: shimmer 1.5s infinite; }
        .fav-skel .skel-line { height: 10px; margin: 9px 10px; border-radius: 4px; background: linear-gradient(90deg,#1a1a1a 25%,#2c2c2c 50%,#1a1a1a 75%); background-size: 200%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    </style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff7a00">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script src="dexie.min.js"></script>
  <script src="idb.js"></script>
  <script src="install-prompt.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.error('SW registration failed:', err));
      });
    }
  </script>
</head>
<body>

    <div class="header">
        <button class="icon-btn" onclick="history.back()" title="Back"><i class="fi fi-rs-arrow-left"></i></button>
        <div class="title"><span>⭐</span> FAVORITES</div>
    </div>

    <div id="favoritesList" class="comics-list"></div>

<script>
    const _supabase = supabase.createClient('https://mmycqeejhguzhtzkyjaj.supabase.co', 'sb_publishable_8Du2GAcH5oBeiHWe-1e0Fg_XtSub2QE', { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'cc-auth' } });
    const myProfile = JSON.parse(localStorage.getItem('user_profile') || '{"handle":"guest"}');

    // ── Accent color (mirrors settings.html / profile.html / discover.html) ──
    function hexToRgb(hex) {
        const clean = (hex || '').replace('#', '');
        const r = parseInt(clean.slice(0,2), 16);
        const g = parseInt(clean.slice(2,4), 16);
        const b = parseInt(clean.slice(4,6), 16);
        return `${r},${g},${b}`;
    }
    function applyAccentColor(hex) {
        const color = hex || '#ff7a00';
        document.documentElement.style.setProperty('--accent', color);
        document.documentElement.style.setProperty('--accent-rgb', hexToRgb(color));
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = color;
    }
    applyAccentColor(myProfile.settings?.accent_color);

    function esc(s) {
        return String(s || '')
            .replace(/&/g,'&amp;').replace(/</g,'&lt;')
            .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function showSkeletons(count = 6) {
        const container = document.getElementById('favoritesList');
        container.innerHTML = Array.from({ length: count }).map(() => `
            <div class="fav-skel">
                <div class="skel-cover"></div>
                <div class="skel-line" style="width:70%;"></div>
                <div class="skel-line" style="width:45%;"></div>
            </div>
        `).join('');
    }

    function showEmpty(icon, title, sub, cta) {
        document.getElementById('favoritesList').innerHTML = `
            <div class="empty">
                <div class="empty-icon">${icon}</div>
                <div class="empty-title">${esc(title)}</div>
                <div class="empty-sub">${esc(sub)}</div>
                ${cta ? `<button class="empty-cta" onclick="${cta.onclick}">${esc(cta.label)}</button>` : ''}
            </div>`;
    }

    async function loadFavorites() {
        if (myProfile.handle === 'guest') {
            showEmpty('🔒', 'Not logged in', 'Log in to see your starred favorites here.');
            return;
        }

        showSkeletons();

        // 1. Get every comic this user has starred (⭐ reaction)
        const { data: starEntries, error: starError } = await _supabase
            .from('messages')
            .select('receiver_hand')
            .eq('sender_handle', myProfile.handle)
            .eq('reaction', '⭐');

        if (starError) {
            showEmpty('⚠️', "Couldn't load favorites", starError.message || 'Something went wrong. Please try again.',
                { label: 'Try again', onclick: 'loadFavorites()' });
            return;
        }

        if (!starEntries || starEntries.length === 0) {
            showEmpty('⭐', 'No Favorites?', "There's gotta be at least one out there, go look..",
                { label: 'Browse Discover', onclick: "location.href='discover.html'" });
            return;
        }

        // 2. Dedupe IDs (defensive — a comic should only ever have one ⭐ row per user)
        const favoriteIds = [...new Set(starEntries.map(entry => entry.receiver_hand))];

        // 3. Fetch the comics themselves + their community ratings, in parallel
        const [{ data: comics, error: comicError }, { data: ratings }] = await Promise.all([
            _supabase.from('comics')
                .select('id,title,cover,owner_handle,views')
                .in('id', favoriteIds),
            _supabase.from('messages')
                .select('receiver_hand,content')
                .eq('reaction', 'rating')
                .in('receiver_hand', favoriteIds)
        ]);

        if (comicError) {
            showEmpty('⚠️', "Couldn't load favorites", comicError.message || 'Something went wrong. Please try again.',
                { label: 'Try again', onclick: 'loadFavorites()' });
            return;
        }

        if (!comics || comics.length === 0) {
            // Every comic behind these ⭐s has since been removed by its creator
            showEmpty('📦', 'Favorites unavailable', 'The comics you starred are no longer available.');
            return;
        }

        renderFavorites(comics, ratings || []);
    }

    function renderFavorites(comics, ratings) {
        const container = document.getElementById('favoritesList');
        container.innerHTML = comics.map(c => {
            const comicRatings = ratings.filter(r => r.receiver_hand === c.id);
            const starCount = comicRatings.length;
            const avgRating = starCount > 0
                ? comicRatings.reduce((sum, r) => sum + (parseInt(r.content) || 0), 0) / starCount
                : 0;
            const subLine = avgRating > 0
                ? `⭐ ${avgRating.toFixed(1)} · @${esc(c.owner_handle || 'unknown')}`
                : `@${esc(c.owner_handle || 'unknown')}`;
            const coverHtml = c.cover
                ? `<img src="${esc(c.cover)}" loading="lazy" decoding="async" class="cover-loading" onload="this.classList.remove('cover-loading')" onerror="this.parentNode.innerHTML='<div class=no-cover>📖</div>'">`
                : `<div class="no-cover">📖</div>`;

            return `
                <div class="comic-card" data-id="${esc(c.id)}">
                    <div class="comic-card-cover">
                        ${coverHtml}
                        <div class="fav-badge">★ Fav</div>
                    </div>
                    <div class="comic-card-info">
                        <div class="comic-card-title">${esc(c.title || 'Untitled')}</div>
                        <div class="comic-card-sub">${subLine}</div>
                    </div>
                </div>`;
        }).join('');

        container.querySelectorAll('.comic-card').forEach(card => {
            card.addEventListener('click', () => {
                location.href = 'reader.html?id=' + encodeURIComponent(card.dataset.id);
            });
        });
    }

    window.addEventListener('load', loadFavorites);
</script>
</body>
</html>
