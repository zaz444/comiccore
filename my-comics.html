<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ComicCore — My Comics</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@3.3.1/css/regular/straight.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/my-comics.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff7a00">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script src="dexie.min.js"></script>
  <script src="idb.js"></script>
  <script src="install-prompt.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.error('SW registration failed:', err));
      });
    }
  </script>
</head>
<body>

<div class="sticky-header">
<!-- Top bar -->
<div class="topbar">
  <a href="index.html" class="back-btn">←</a>
  <div class="topbar-center">
    <div class="topbar-title">My Comics</div>
    <div class="topbar-sub" id="topbar-sub">Loading…</div>
  </div>
  <button class="select-toggle-btn" id="select-toggle-btn" onclick="toggleDraftSelectMode()">Select</button>
  <button class="new-btn" onclick="openNewSheet()">+ New</button>
</div>
<!-- Tabs -->
<div class="tabs">
  <button class="tab active" id="tab-drafts" onclick="switchTab('drafts')">
    Drafts <span class="tab-count" id="drafts-count">0</span>
  </button>
  <button class="tab" id="tab-published" onclick="switchTab('published')">
    Published <span class="tab-count" id="pub-count">0</span>
  </button>
  <button class="tab" id="tab-collab" onclick="switchTab('collab')">
    <svg width="13" height="13" viewBox="0 0 26 26" style="display:inline-block;vertical-align:-2px;margin-right:2px;"><rect x="0.5" y="0.5" width="25" height="25" rx="7" fill="#ff7a00"/><text x="13" y="17.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="900" fill="#000">Co</text></svg> Collab <span class="tab-count" id="collab-count" style="display:none;"></span>
  </button>
</div>
</div><!-- end sticky-header -->

<!-- Content -->
<div class="content">
  <!-- Drafts toolbar -->
  <div class="toolbar" id="drafts-toolbar">
    <input class="search-box" id="draft-search" placeholder="Search drafts…" oninput="renderDrafts()">
    <select class="sort-select" id="draft-sort" onchange="renderDrafts()">
      <option value="newest">Newest</option>
      <option value="oldest">Oldest</option>
      <option value="alpha">A→Z</option>
      <option value="pages">Pages</option>
    </select>
  </div>

  <!-- Published toolbar -->
  <div class="toolbar" id="pub-toolbar" style="display:none;">
    <input class="search-box" id="pub-search" placeholder="Search published…" oninput="renderPublished()">
    <select class="sort-select" id="pub-sort" onchange="renderPublished()">
      <option value="newest">Newest</option>
      <option value="stars">⭐ Stars</option>
      <option value="alpha">A→Z</option>
    </select>
  </div>

  <!-- Stats bars -->
  <div id="draft-stats" class="stats-bar" style="display:none;"></div>
  <div id="pub-stats" class="stats-bar" style="display:none;"></div>

  <!-- List container -->
  <div id="list-container"></div>

  <!-- Collab container -->
  <div id="collab-container" style="display:none; padding: 12px;"></div>
</div>

<!-- Bottom Nav -->

<!-- ── Draft Select Bar ── -->
<div class="draft-select-bar" id="draft-select-bar">
  <div class="dsel-count" id="draft-select-count">0 selected</div>
  <div class="dsel-spacer"></div>
  <button class="dsel-btn" onclick="selectAllDrafts()">Select All</button>
  <button class="dsel-btn danger" onclick="bulkDeleteDrafts()"><i class="fi fi-rs-trash"></i> Delete</button>
</div>

<!-- ── Detail Popup (same structure as discover.html) ── -->
<div class="popup-overlay" id="popup-overlay" onclick="if(event.target===this)closePopup()">
  <div class="popup-sheet" id="popup-sheet">
    <button class="popup-close" onclick="closePopup()">✕</button>
    <div id="popup-cover-wrap"></div>
    <div class="popup-body">
      <div class="popup-title"    id="popup-title"></div>
      <div class="popup-creator"  id="popup-creator"></div>
      <div class="popup-meta-row" id="popup-meta"></div>
      <div class="popup-desc"     id="popup-desc" style="display:none;"></div>
      <div class="popup-btns"     id="popup-btns"></div>
    </div>
  </div>
</div>

<!-- ── Action Sheet (draft) ── -->
<div id="action-sheet" class="overlay" onclick="if(event.target===this)closeActionSheet()">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-header-title" id="action-sheet-title">Comic</div>
      <div class="sheet-header-sub" id="action-sheet-sub"></div>
    </div>
    <div id="action-sheet-body"></div>
  </div>
</div>

<!-- ── New Comic Sheet ── -->
<div id="new-sheet" class="overlay" onclick="if(event.target===this)closeNewSheet()">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-header-title">📖 New Comic</div>
      <div class="sheet-header-sub">Pick a canvas ratio — can't change later.</div>
    </div>
    <div class="ratio-grid" id="ratio-grid"></div>
    <button class="sheet-cta" onclick="startNewComic()">START CREATING →</button>
  </div>
</div>

<!-- ── New Comic: Mode Sheet (same Comic/Novels choice as index.html) ── -->
<div id="mode-sheet" class="overlay" onclick="if(event.target===this)closeModeSheet()">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header" style="text-align:center;">
      <div class="sheet-header-title">What are you making?</div>
      <div class="sheet-header-sub">Choose your creation type</div>
    </div>
    <div class="mode-grid">
      <button class="mode-btn" onclick="goToNewMode('comic')">
        <img src="https://mmycqeejhguzhtzkyjaj.supabase.co/storage/v1/object/public/avatars/uibuttons/edit.webp" alt="edit" style="width:40px;height:40px;object-fit:contain;">
        <span style="font-weight:900;font-size:16px;color:var(--orange);">COMIC</span>
        <span style="font-size:11px;color:var(--text-muted);text-align:center;">New Comic</span>
      </button>
      <button class="mode-btn" onclick="goToNewMode('story')">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--teal);"><path d="M7 3.5h9a1 1 0 0 1 1 1V17a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V3.5Z"/><path d="M7 3.5H5.5a1 1 0 0 0-1 1V19a1 1 0 0 0 1 1H15"/><path d="M10 8h4"/><path d="M10 11.5h4"/></svg>
        <span style="font-weight:900;font-size:16px;color:var(--teal);">NOVELS</span>
        <span style="font-size:11px;color:var(--text-muted);text-align:center;">Write your story</span>
      </button>
    </div>
    <button class="rename-cancel" style="display:block;width:calc(100% - 40px);margin:14px 20px 4px;" onclick="backToRatioSheet()">← Back to Ratio</button>
  </div>
</div>

<!-- ── Rename Sheet ── -->
<div id="rename-sheet" class="overlay" onclick="if(event.target===this)closeRenameSheet()">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-header-title">✏️ Rename Draft</div>
    </div>
    <div class="rename-wrap">
      <input class="rename-input" id="rename-inp" placeholder="Comic title…" maxlength="80">
      <div class="rename-row">
        <button class="rename-cancel" onclick="closeRenameSheet()">Cancel</button>
        <button class="rename-ok" onclick="confirmRename()">Rename</button>
      </div>
    </div>
  </div>
</div>

<!-- ── Delete Confirm Sheet ── -->
<div id="del-sheet" class="overlay" onclick="if(event.target===this)closeDelSheet()">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="del-wrap">
      <div class="del-title" id="del-title">Delete?</div>
      <div class="del-sub" id="del-sub"></div>
      <button class="del-confirm" onclick="confirmDelete()">DELETE PERMANENTLY</button>
      <button class="del-cancel" onclick="closeDelSheet()">Cancel</button>
    </div>
  </div>
</div>

<script src="javascript/my-comics.js"></script>
</body>
</html>
